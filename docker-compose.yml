name: spanel

services:
  app:
    build: .
    # SPANEL-SEC-2026-001: sin publicar 3000 en el host (ni IPv4 ni IPv6).
    # El panel solo debe entrar por Traefik a través de la red proxy.
    # No volver a agregar `ports:` aquí: el puerto queda accesible desde
    # cualquier contenedor conectado a las mismas redes (ver README).
    env_file:
      - .env.docker
    environment:
      WORKERS: ${WORKERS:-1}
      # A.SPEC 0102/0111/0113: the app never runs host code. It only speaks to
      # two root-owned Unix sockets mounted read-only below. Keep these paths
      # identical to the values in the tenant settings and systemd units.
      SPANEL_PLAN_AGENT_SOCKET: /run/spanel/plan-agent.sock
      SPANEL_PLAN_AGENT_TOKEN_FILE: /run/secrets/plan_agent_token
      SPANEL_CELL_METRICS_SOCKET: /run/spanel/cell-metrics.sock
      SPANEL_CELL_METRICS_TOKEN_FILE: /run/secrets/cell_metrics_token
      # A.SPEC 0110: hosting resolves each site's registered runtime from the
      # host registry and, for rootless cells, its own dockerd socket.
      SPANEL_TENANTS_ROOTLESS: ${SPANEL_TENANTS_ROOTLESS:-true}
      SPANEL_TENANTS_DATA_ROOT: /var/lib/spanel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - apps_state:/var/lib/spanel/apps
      - ${SPANEL_APPS_ENCRYPTION_KEY_PATH:-./secrets/apps_key}:/run/secrets/apps_key:ro
      - hosting_backups:/var/lib/spanel/hosting-backups
      # Estado del agente de certificados de correo (A.SPEC 0035/0036).
      # La app solo lee state/jobs y escribe requests; nunca claves privadas.
      - /var/lib/spanel/cert-manager:/var/lib/spanel/cert-manager
      # Host sockets (read-only). The agent/daemon must exist before `up`:
      # missing token files fail closed instead of creating host directories.
      - type: bind
        source: ${SPANEL_AGENT_RUNTIME_DIR:-/run/spanel}
        target: /run/spanel
        read_only: true
      - type: bind
        source: ${SPANEL_PLAN_AGENT_TOKEN_PATH:-/etc/spanel/plan_agent_token}
        target: /run/secrets/plan_agent_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPANEL_CELL_METRICS_TOKEN_PATH:-/etc/spanel/cell_metrics_token}
        target: /run/secrets/cell_metrics_token
        read_only: true
        bind:
          create_host_path: false
      # A.SPEC 0110: the whole data root is visible read-only because
      # registry.json is replaced atomically (a file bind mount would go
      # stale); only /var/lib/spanel/cells is writable for per-cell state.
      - type: bind
        source: ${SPANEL_TENANTS_DATA_ROOT_HOST:-/var/lib/spanel}
        target: /var/lib/spanel
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPANEL_TENANTS_CELLS_DIR:-/var/lib/spanel/cells}
        target: /var/lib/spanel/cells
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.spanel-http.entrypoints=web"
      - "traefik.http.routers.spanel-http.rule=Host(`${SPANEL_DOMAIN:-spanel.systutor.com}`)"
      - "traefik.http.routers.spanel-http.middlewares=spanel-https-redirect"
      - "traefik.http.routers.spanel.entrypoints=websecure"
      - "traefik.http.routers.spanel.rule=Host(`${SPANEL_DOMAIN:-spanel.systutor.com}`)"
      - "traefik.http.routers.spanel.tls=true"
      - "traefik.http.routers.spanel.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Ningún formulario de login debe viajar por HTTP plano.
      - "traefik.http.middlewares.spanel-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.spanel-https-redirect.redirectscheme.permanent=true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  apps-worker:
    build: .
    command: ["dramatiq", "plugins.apps.backend.tasks", "--processes", "1", "--threads", "1", "--queues", "apps"]
    env_file:
      - .env.docker
    environment:
      # The worker also resolves rootless runtimes and publishes relay routes.
      SPANEL_PLAN_AGENT_SOCKET: /run/spanel/plan-agent.sock
      SPANEL_PLAN_AGENT_TOKEN_FILE: /run/secrets/plan_agent_token
      SPANEL_TENANTS_ROOTLESS: ${SPANEL_TENANTS_ROOTLESS:-true}
      SPANEL_TENANTS_DATA_ROOT: /var/lib/spanel
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - apps_state:/var/lib/spanel/apps
      - ${SPANEL_APPS_ENCRYPTION_KEY_PATH:-./secrets/apps_key}:/run/secrets/apps_key:ro
      - type: bind
        source: ${SPANEL_AGENT_RUNTIME_DIR:-/run/spanel}
        target: /run/spanel
        read_only: true
      - type: bind
        source: ${SPANEL_PLAN_AGENT_TOKEN_PATH:-/etc/spanel/plan_agent_token}
        target: /run/secrets/plan_agent_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPANEL_TENANTS_DATA_ROOT_HOST:-/var/lib/spanel}
        target: /var/lib/spanel
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SPANEL_TENANTS_CELLS_DIR:-/var/lib/spanel/cells}
        target: /var/lib/spanel/cells
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  hosting_backups:
  apps_state:

networks:
  proxy:
    external: true
