# Shared AF_UNIX runtime directory for the host agents (A.SPEC 0102/0104/0113).
#
# plan-agent and cell-metrics run as root but with constrained capabilities
# (cell-metrics drops CAP_DAC_OVERRIDE), while edge-relay runs as Traefik's uid.
# The directory must therefore be writable by both root and the Traefik group
# without being owned by either of the unprivileged agents.
d /run/spanel 0770 root <SPANEL_TRAEFIK_UID> -
